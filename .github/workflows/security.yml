name: Enterprise Security & Compliance Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly every Monday at 04:00 UTC to catch newly disclosed CVEs
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret & Credential Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Software Composition Analysis (SCA) & Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run npm Audit
        run: npm audit --omit=dev --audit-level=high

  sast-analysis:
    name: Static Application Security Testing (Semgrep SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Rules for OWASP Top 10
        run: semgrep scan --config auto --sarif --output semgrep.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  security-unit-tests:
    name: Security & RBAC Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sai_books_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sai_books_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sai_books_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/sai_books_test?schema=public"
      JWT_SECRET: "test-secret-at-least-32-characters-long-for-testing-only"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NODE_ENV: "test"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npx prisma generate

      - name: Prepare Test Database
        run: npx prisma db push --skip-generate

      - name: Run Typecheck
        run: npm run typecheck

      - name: Execute Security & RBAC Tests
        run: npm run test:security

      - name: Execute All Unit Tests
        run: npm run test

  container-security:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [security-unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        run: docker build -t sai-books:scan .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sai-books:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
